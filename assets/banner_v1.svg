<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background gradient: deep slate up to slightly lighter charcoal -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="65%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#1a1e29"/>
    </linearGradient>

    <!-- Accent gradient: cyan to purple -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="55%" stop-color="#a05cfc"/>
      <stop offset="100%" stop-color="#ff4ecd"/>
    </linearGradient>

    <!-- Glow filter for text/highlights -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base background + grid -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Top/bottom ambient bars -->
  <rect x="0" y="40" width="1280" height="2" fill="url(#accent)" opacity="0.3"/>
  <rect x="0" y="598" width="1280" height="2" fill="url(#accent)" opacity="0.3"/>

  <!-- Terminal window -->
  <g transform="translate(300, 120)">
    <!-- Window background -->
    <rect width="680" height="260" rx="12" fill="#111318" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Title bar -->
    <rect width="680" height="40" rx="12" fill="#0d0f13"/>
    <rect y="20" width="680" height="20" fill="#0d0f13"/> <!-- hide top-corner radii -->
    
    <!-- Traffic lights -->
    <circle cx="32" cy="20" r="5.5" fill="#ff5f58"/>
    <circle cx="52" cy="20" r="5.5" fill="#febc2e"/>
    <circle cx="72" cy="20" r="5.5" fill="#28c840"/>
    
    <!-- Title -->
    <text x="340" y="24" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)">opencode-talk — zsh</text>

    <!-- Terminal content -->
    <g transform="translate(30, 65)">
      <!-- Prompt line 1 -->
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5c7cfa">
        <tspan font-weight="700">$</tspan><tspan dx="8" fill="#d1d5db">opencode</tspan>
      </text>
      <!-- Prompt line 2 (mic active) -->
      <text x="0" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#5c7cfa">
        <tspan font-weight="700">$</tspan><tspan dx="8" fill="#d1d5db">voice</tspan>
      </text>
      <!-- Active listening status line (glowing, animated via CSS or static) -->
      <g transform="translate(0, 72)">
        <rect width="210" height="32" rx="6" fill="rgba(0, 240, 255, 0.08)" stroke="url(#accent)" stroke-width="1" filter="url(#glow)"/>
        <text x="16" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#ffffff">
          <tspan fill="#00f0ff">🎤</tspan><tspan dx="6" fill="#ffffff">LISTENING</tspan><tspan dx="2" fill="#a05cfc">···</tspan>
        </text>
      </g>
      <!-- Result line -->
      <text x="0" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#d1d5db">
        Refactor auth middleware to use JWT...
      </text>
      <!-- Cursor blink -->
      <rect x="324" y="133" width="8" height="17" fill="#00f0ff" opacity="0.8"/>
    </g>
  </g>

  <!-- Microphone Icon (hero element, centered below terminal) -->
  <g transform="translate(610, 410)">
    <path d="M30 42c0-6.627-5.373-12-12-12S6 35.373 6 42v10c0 6.627 5.373 12 12 12s12-5.373 12-12V42z" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 43v9c0 12.15-9.85 22-22 22S4 64.15 4 52v-9" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 74v14" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 88h20" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Soundwaves radiating out -->
    <path d="M-20 38c-10-8-10-20 0-28" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M-30 30c-14-12-14-30 0-42" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <path d="M80 38c10-8 10-20 0-28" fill="none" stroke="#ff4ecd" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M90 30c14-12 14-30 0-42" fill="none" stroke="#ff4ecd" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Decorative horizontal sound bars (equalizer effect) -->
  <g transform="translate(200, 535)">
    <rect x="0" y="12" width="4" height="16" rx="2" fill="url(#accent)" opacity="0.5"/>
    <rect x="10" y="4" width="4" height="32" rx="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="20" y="8" width="4" height="24" rx="2" fill="url(#accent)" opacity="0.5"/>
    <rect x="30" y="0" width="4" height="40" rx="2" fill="url(#accent)" opacity="0.7"/>
    <rect x="40" y="10" width="4" height="20" rx="2" fill="url(#accent)" opacity="0.5"/>
    <rect x="50" y="6" width="4" height="28" rx="2" fill="url(#accent)" opacity="0.6"/>
  </g>
  <g transform="translate(1020, 535)">
    <rect x="0" y="6" width="4" height="28" rx="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="10" y="0" width="4" height="40" rx="2" fill="url(#accent)" opacity="0.7"/>
    <rect x="20" y="8" width="4" height="24" rx="2" fill="url(#accent)" opacity="0.5"/>
    <rect x="30" y="4" width="4" height="32" rx="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="40" y="12" width="4" height="16" rx="2" fill="url(#accent)" opacity="0.5"/>
    <rect x="50" y="10" width="4" height="20" rx="2" fill="url(#accent)" opacity="0.5"/>
  </g>

  <!-- Floating particles / data nodes (connected to imply "flow to core") -->
  <g opacity="0.4">
    <circle cx="240" cy="280" r="3" fill="#00f0ff"/>
    <circle cx="200" cy="340" r="2" fill="#a05cfc"/>
    <circle cx="1080" cy="250" r="3" fill="#ff4ecd"/>
    <circle cx="1120" cy="320" r="2" fill="#00f0ff"/>
    <path d="M240 280 Q 270 230 300 210" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M1080 250 Q 1050 200 980 180" fill="none" stroke="#ff4ecd" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Bottom text tagline -->
  <text x="640" y="610" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="rgba(255,255,255,0.35)" letter-spacing="0.5">
    Voice-to-text for the terminal IDE
  </text>
</svg>
